name: Publish to npm

on:
  push:
    branches: [main, master]

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # OIDC для npm Trusted Publishing

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve next version
        id: version
        run: |
          set -euo pipefail
          LOCAL="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view mcp-my-team version 2>/dev/null || true)"

          if [ -n "$PUBLISHED" ]; then
            npm version "$PUBLISHED" --no-git-tag-version --allow-same-version
            npm version patch --no-git-tag-version
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "Первая публикация: ${LOCAL}"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing mcp-my-team@${VERSION}"

      - name: Publish
        run: npm publish

      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git push
